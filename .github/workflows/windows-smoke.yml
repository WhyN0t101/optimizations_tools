# Runs FocusedTweaks for real on a disposable Windows Server 2025 runner (the closest image to Windows 11 24H2):
# dry runs, a real run with the defaults, the health check and -Revert. The runner is thrown away afterwards.
# Logs, health and revert-check JSON and summary.txt are uploaded as the "smoke-results" artifact.
name: windows smoke test

on:
  push:
    paths: ['windows/**', '.github/workflows/windows-smoke.yml', '.github/workflows/windows-build.yml']
  workflow_dispatch:

# A newer push to the same branch cancels this run: only the newest commit's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml

  smoke:
    needs: build
    runs-on: windows-2025
    # Each of the six stages stops itself after 12 minutes and still reports; this only catches the rest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FocusedTweaks
          path: dist

      - name: Dry runs, real run, health check, revert
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\tools\Test-Smoke.ps1 -Script dist\FocusedTweaks.ps1 -OutDir smoke
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test failed: see the job summary and the smoke-results artifact.' }

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          path: smoke
