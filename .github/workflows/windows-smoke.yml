# Runs FocusedTweaks for real on disposable GitHub runners: dry runs, a real run with the defaults, the health check,
# -Reapply and -Revert. The runners are thrown away afterwards.
# - windows-2025: Windows Server 2025, x64, the closest Server image to Windows 11 24H2. No Store apps, Quick Assist
#   or restore points.
# - windows-11-arm: Windows 11 client on ARM64. Has the client parts Server lacks; no NVIDIA, and x64-only installers
#   run under emulation.
# Logs, health and revert-check JSON and summary.txt are uploaded per runner as "smoke-results-<runner>".
# A weekly run catches Windows changes (the runner images get each month's updates) in weeks without a commit.
name: windows smoke test

on:
  push:
    paths: ['windows/**', '.github/workflows/windows-smoke.yml', '.github/workflows/windows-build.yml']
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

# A newer push to the same branch cancels this run: only the newest commit's result matters. The event is in the
# group so the weekly run and a push never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    # Each of the stages stops itself after 12 minutes and still reports; this only catches the rest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FocusedTweaks
          path: dist

      # What a fresh Windows 11 ships, before anything is changed: what FocusedTweaks does not know yet, and what is new
      # since the last run on main (what a Windows update added). Reads only and never fails the run.
      - name: Previous inventory
        if: matrix.runner == 'windows-11-arm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: inventory-prev
          key: inventory-${{ matrix.runner }}-${{ github.run_id }}
          restore-keys: inventory-${{ matrix.runner }}-

      - name: Inventory of the fresh image
        if: matrix.runner == 'windows-11-arm'
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\tools\Get-Inventory.ps1 -Script dist\FocusedTweaks.ps1 -Known windows\tools\inventory-known.json -Previous inventory-prev\inventory.json -OutDir inventory
          if (Test-Path inventory\summary.txt) {
            @('### Inventory of the fresh image', '```') + @(Get-Content inventory\summary.txt) + @('```') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            # The whole list, not just the counts: annotations are public, the job summary needs a signed in reader.
            $all = (@(Get-Content inventory\summary.txt) -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::notice title=Inventory::$all"
          }

      # The step times of the last run on this runner, so the summary shows each step against it and flags one that
      # got much slower. Restoring by prefix picks the newest saved copy.
      - name: Previous step times
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: step-times
          key: step-times-${{ matrix.runner }}-${{ github.run_id }}
          restore-keys: step-times-${{ matrix.runner }}-

      - name: Dry runs, real run, health check, reapply, revert
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\tools\Test-Smoke.ps1 -Script dist\FocusedTweaks.ps1 -OutDir smoke -PreviousTimes step-times\steps.json
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test failed: see the job summary and the smoke-results artifact.' }

      # Only main sets the baseline, and only a passing run: a failed run stops early and would look fast.
      - name: Keep these step times for the next run
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path step-times -Force | Out-Null
          Copy-Item -LiteralPath smoke\steps.json -Destination step-times\steps.json -Force
      - if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: step-times
          key: step-times-${{ matrix.runner }}-${{ github.run_id }}

      - name: Keep this inventory for the next run
        if: success() && github.ref == 'refs/heads/main' && matrix.runner == 'windows-11-arm' && hashFiles('inventory/inventory.json') != ''
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path inventory-prev -Force | Out-Null
          Copy-Item -LiteralPath inventory\inventory.json -Destination inventory-prev\inventory.json -Force
      - if: success() && github.ref == 'refs/heads/main' && matrix.runner == 'windows-11-arm' && hashFiles('inventory/inventory.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: inventory-prev
          key: inventory-${{ matrix.runner }}-${{ github.run_id }}

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-${{ matrix.runner }}
          path: |
            smoke
            inventory
