# Builds FocusedTweaks.ps1 from windows/src and the ZOICWARE copy in windows/upstream, checks that the committed script
# and options reference match that build, and runs the static tests under Windows PowerShell 5.1 and PowerShell 7.
# Nothing here runs FocusedTweaks.ps1 itself.
name: windows build

on:
  push:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  workflow_call:

# A newer push to the same branch cancels this run; tags (releases) are never cancelled. When another workflow calls
# this one, github.workflow is the caller's name, so its group never collides with the caller or a standalone build.
concurrency:
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Actions are pinned to the commit their release tag pointed to (the tag is in the comment), so a moved or
# hijacked tag cannot change what runs. Update both together.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The ZOICWARE files come from windows/upstream/zoicware (pinned by SHA256 in build.py): the original
      # repository is no longer on GitHub, so nothing is downloaded.
      - name: Build
        working-directory: windows
        shell: pwsh
        run: |
          python tools/build.py --out FocusedTweaks.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build.py failed' }

      - name: Committed script matches the build
        shell: pwsh
        run: |
          git diff --ignore-cr-at-eol --exit-code -- windows/FocusedTweaks.ps1 windows/docs/OPTIONS.md windows/docs/REGISTRY.md
          if ($LASTEXITCODE -ne 0) { throw 'FocusedTweaks.ps1, docs/OPTIONS.md or docs/REGISTRY.md is out of date: rebuild and commit them.' }

      - name: Test-Parse (Windows PowerShell 5.1)
        working-directory: windows
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test-Parse failed under Windows PowerShell 5.1' }

      - name: Test-Parse (PowerShell 7)
        working-directory: windows
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-Parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test-Parse failed under PowerShell 7' }

      - name: Keep the built script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FocusedTweaks
          path: |
            windows/FocusedTweaks.ps1
            windows/NOTICE.md
            windows/README.md
            windows/docs/GUIDE.md
            windows/tools/Measure-Performance.ps1
            windows/tools/Explain-Processes.ps1
            windows/profiles/*.json
